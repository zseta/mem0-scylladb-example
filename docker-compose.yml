services:
  scylla-node1:
    image: scylladb/scylla:2026.2
    container_name: scylla-node1
    command: >
      --seeds=scylla-node1 --smp 1 --memory 750M --overprovisioned 1
      --api-address 0.0.0.0 --vector-store-primary-uri http://vector-store:6080
    ports:
      - "9042:9042"
    volumes:
      - scylla-node1-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' scylla-node1"]
      interval: 10s
      timeout: 5s
      retries: 30

  scylla-node2:
    image: scylladb/scylla:2026.2
    container_name: scylla-node2
    command: >
      --seeds=scylla-node1 --smp 1 --memory 750M --overprovisioned 1
      --api-address 0.0.0.0 --vector-store-primary-uri http://vector-store:6080
    depends_on:
      - scylla-node1
    volumes:
      - scylla-node2-data:/var/lib/scylla

  scylla-node3:
    image: scylladb/scylla:2026.2
    container_name: scylla-node3
    command: >
      --seeds=scylla-node1 --smp 1 --memory 750M --overprovisioned 1
      --api-address 0.0.0.0 --vector-store-primary-uri http://vector-store:6080
    depends_on:
      - scylla-node1
    volumes:
      - scylla-node3-data:/var/lib/scylla

  vector-store:
    image: scylladb/vector-store:1.8.0
    container_name: vector-store
    environment:
      VECTOR_STORE_URI: 0.0.0.0:6080
      VECTOR_STORE_SCYLLADB_URI: scylla-node1:9042
    depends_on:
      - scylla-node1

volumes:
  scylla-node1-data:
  scylla-node2-data:
  scylla-node3-data:
